<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - StudyNotes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">StudyNotes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="subjects.html">Subjects</a></li>
                    <li class="nav-item"><a class="nav-link" href="notes.html">Notes</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
    <main>
        <h2>Contact Us</h2>
        <section class="features">
            <p>Have a question or want to contribute your notes? Fill the form below.</p>
            <form>
                <label>Your Name:</label>
                <input type="text" placeholder="Enter your name">
                
                <label>Email:</label>
                <input type="email" placeholder="Enter your email">
                
                <label>Message:</label>
                <textarea rows="5" placeholder="Type your message here"></textarea>
                
                <button type="submit" class="btn">Send Message</button>
            </form>
            <br>
            <p><strong>Email:</strong> help@studynotes.com</p>
        </section>
    </main>
    <footer><p>&copy; 2026 StudyNotes. All rights reserved.</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
